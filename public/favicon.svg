<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente da Marca AniMatch -->
    <linearGradient id="am-radar" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="am-fill" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Fundo App/Favicon -->
  <rect width="64" height="64" rx="16" fill="#0B0F19"/>

  <!-- Eixos Radiais (Centro -> Vértices) -->
  <path d="M32 32L32 10 M32 32L51 21 M32 32L51 43 M32 32L32 54 M32 32L13 43 M32 32L13 21" 
        stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Grade Hexagonal Externa -->
  <polygon points="32,10 51,21 51,43 32,54 13,43 13,21" 
           stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Grade Hexagonal Interna -->
  <polygon points="32,21 41.5,26.5 41.5,37.5 32,43 22.5,37.5 22.5,26.5" 
           stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.2"/>

  <!-- Forma de Afinidade / Match -->
  <polygon points="32,12 47,23 39,46 25,40 18,24" 
           fill="url(#am-fill)" stroke="url(#am-radar)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Ponto de Match com Glow -->
  <circle cx="32" cy="12" r="5" fill="#06B6D4" fill-opacity="0.3"/>
  <circle cx="32" cy="12" r="3" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.5"/>
</svg>
