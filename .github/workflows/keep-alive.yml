name: Supabase Keep Alive

on:
  schedule:
    # Executa a cada 3 dias às 04:00 UTC
    - cron: '0 4 */3 * *'
  # Permite disparar manualmente pela aba Actions para testar
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          
          # Remove trailing slash se houver
          BASE_URL="${SUPABASE_URL%/}"
          
          echo "Realizando ping no Supabase Health ($BASE_URL/auth/v1/health)..."
          
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "$BASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | sed -e 's/HTTP_STATUS://')
          
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Supabase ativo com sucesso!"
          else
            echo "Falha na comunicação ou projeto pausado."
            exit 1
          fi
