name: Supabase Keep Alive

on:
  schedule:
    # Executa a cada 3 dias às 04:00 UTC
    - cron: '0 4 */3 * *'
  # Permite disparar manualmente pela aba Actions para testar
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          
          echo "HTTP Status: $RESPONSE"
          
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ]; then
            echo "Supabase ativo com sucesso!"
          else
            echo "Falha na comunicação ou projeto pausado."
            exit 1
          fi
